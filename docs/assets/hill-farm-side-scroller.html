/* ---------- Helpers ---------- */
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const m4=k=>((k%4)+4)%4;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rr(x,y,w,h,r){X.beginPath();if(X.roundRect)X.roundRect(x,y,w,h,r||0);else X.rect(x,y,w,h);}
function fillStroke(f,lw){X.fillStyle=f;X.fill();X.lineWidth=lw||3;X.strokeStyle=INK;X.lineJoin='round';X.stroke();}
function circ(x,y,r){X.beginPath();X.arc(x,y,r,0,Math.PI*2);}
function blob(cs,fill,lw){X.beginPath();for(const[a,b,r]of cs){X.moveTo(a+r,b);X.arc(a,b,r,0,Math.PI*2)}X.lineWidth=(lw||3)*2;X.strokeStyle=INK;X.lineJoin='round';X.stroke();X.fillStyle=fill;X.fill();}
function poly(pts){X.beginPath();X.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)X.lineTo(pts[i],pts[i+1]);X.closePath();}
function line(x1,y1,x2,y2,col,lw){X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.lineCap='round';X.lineWidth=lw+4;X.strokeStyle=INK;X.stroke();X.lineWidth=lw;X.strokeStyle=col;X.stroke();}
function msLogo(x,y,s){const g=s*0.08,q=(s-g)/2;X.fillStyle=MS.r;X.fillRect(x,y,q,q);X.fillStyle=MS.g;X.fillRect(x+q+g,y,q,q);X.fillStyle=MS.b;X.fillRect(x,y+q+g,q,q);X.fillStyle=MS.y;X.fillRect(x+q+g,y+q+g,q,q);}
function text(s,x,y,size,col,align,stroke,weight){X.font=`${weight||900} ${size}px "Segoe UI",system-ui,sans-serif`;X.textAlign=align||'center';X.textBaseline='middle';if(stroke!==false){X.lineWidth=Math.max(3,size/5);X.strokeStyle=INK;X.lineJoin='round';X.strokeText(s,x,y);}X.fillStyle=col||'#fff';X.fillText(s,x,y);}
function wrapText(s,x,y,maxW,size,col,lh,weight){X.font=`${weight||600} ${size}px "Segoe UI",system-ui,sans-serif`;const words=s.split(' ');let ln='',yy=y;X.textAlign='center';X.textBaseline='middle';X.fillStyle=col;for(const w of words){const t=ln?ln+' '+w:w;if(X.measureText(t).width>maxW&&ln){X.fillText(ln,x,yy);ln=w;yy+=lh}else ln=t}X.fillText(ln,x,yy);return yy;}
function starPath(x,y,r){X.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*0.45:r;X.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}X.closePath();}
function heartPath(x,y,s){X.beginPath();X.moveTo(x,y+s*0.3);X.bezierCurveTo(x,y,x-s*0.6,y-s*0.1,x-s*0.6,y+s*0.3);X.bezierCurveTo(x-s*0.6,y+s*0.65,x-s*0.1,y+s*0.8,x,y+s);X.bezierCurveTo(x+s*0.1,y+s*0.8,x+s*0.6,y+s*0.65,x+s*0.6,y+s*0.3);X.bezierCurveTo(x+s*0.6,y-s*0.1,x,y,x,y+s*0.3);X.closePath();}
function shieldPath(cx,top,w,h){X.beginPath();X.moveTo(cx,top);X.lineTo(cx+w/2,top+h*0.15);X.lineTo(cx+w/2,top+h*0.5);X.quadraticCurveTo(cx+w/2,top+h*0.85,cx,top+h);X.quadraticCurveTo(cx-w/2,top+h*0.85,cx-w/2,top+h*0.5);X.lineTo(cx-w/2,top+h*0.15);X.closePath();}
function bellPath(cx,top,s){X.beginPath();X.moveTo(cx-s,top+s*1.8);X.bezierCurveTo(cx-s,top+s*0.3,cx-s*0.6,top,cx,top);X.bezierCurveTo(cx+s*0.6,top,cx+s,top+s*0.3,cx+s,top+s*1.8);X.closePath();}
function drawKey(x,y,s,col){circ(x-s*0.6,y,s*0.55);fillStroke(col||MS.y,2);rr(x-s*0.1,y-s*0.15,s*1.2,s*0.3,2);fillStroke(col||MS.y,2);rr(x+s*0.75,y,s*0.22,s*0.4,1);fillStroke(col||MS.y,2);X.fillStyle=INK;circ(x-s*0.6,y,s*0.18);X.fill();}

 const off=e=>{e.preventDefault();touch[k]=false};
 el.addEventListener('touchstart',on,{passive:false});el.addEventListener('touchend',off,{passive:false});el.addEventListener('touchcancel',off);
 el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off);}

/* ---------- Audio ---------- */
let AC=null,muted=false;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(AC.state==='suspended')AC.resume();}
function beep(f,d,type,v,slide){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(v||0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}
const SFX={
 jump:()=>beep(420,0.15,'square',0.04,380),
 coin:()=>{beep(988,0.07,'square',0.04);setTimeout(()=>beep(1319,0.12,'square',0.04),60)},
 baa:()=>{beep(360,0.12,'sawtooth',0.05,-40);setTimeout(()=>beep(330,0.3,'sawtooth',0.05,-90),110)},
 stomp:()=>beep(260,0.18,'triangle',0.09,-180),
 hurt:()=>beep(200,0.35,'sawtooth',0.07,-140),
 flag:()=>[660,880].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'square',0.04),i*90)),
 win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.16,'square',0.05),i*110)),
 howl:()=>beep(300,0.8,'sine',0.08,400),
 sel:()=>beep(700,0.05,'square',0.03)
};

function drawShepherd(x,y,face,t,run,air,sc){

 X.strokeStyle='#2b2433';X.lineWidth=3;X.beginPath();X.moveTo(-6,-16);X.lineTo(-6+sw*0.7,air?-6:-2);X.moveTo(6,-16);X.lineTo(6-sw*0.7,air?-9:-2);X.stroke();
 // crook
 X.lineWidth=7;X.strokeStyle=INK;X.beginPath();X.moveTo(19,-2);X.lineTo(19,-58);X.arc(12,-58,7,0,Math.PI,true);X.stroke();
 X.lineWidth=4;X.strokeStyle='#c98a3a';X.beginPath();X.moveTo(19,-2);X.lineTo(19,-58);X.arc(12,-58,7,0,Math.PI,true);X.stroke();
 // robe
 rr(-15,-44,30,32,11);fillStroke(MS.blue);
 X.fillStyle=MS.b;rr(-11,-41,8,26,4);X.fill();
 X.fillStyle=MS.y;X.fillRect(-14,-26,28,5);
 msLogo(-5,-38,10);
 // hand
 circ(17,-30,5);fillStroke('#ffd2a8',2);
 // head
 circ(0,-54,12);fillStroke('#ffd2a8');
 X.fillStyle='#ff9e8a';circ(7,-50,3);X.fill();
 X.fillStyle=INK;circ(6,-56,2.2);X.fill();
 X.strokeStyle=INK;X.lineWidth=2;X.beginPath();X.arc(4,-51,4,0.2,1.4);X.stroke();
 // hat
 rr(-17,-66,34,6,3);fillStroke(MS.b);rr(-10,-77,20,13,6);fillStroke(MS.b);X.fillStyle=MS.r;X.fillRect(-9,-68,18,3);
 X.restore();
}
function drawSheep(cx,by,face,t,black,sc,hop){
 X.save();X.translate(cx,by-(hop||0));X.scale(face*(sc||1),sc||1);
 const wool=black?'#3d3650':'#ffffff',head=black?'#120f18':'#2b2433',lg=Math.sin(t*0.3)*3;
 X.strokeStyle=INK;X.lineWidth=5;X.lineCap='round';X.beginPath();X.moveTo(-8,-10);X.lineTo(-8+lg,0);X.moveTo(8,-10);X.lineTo(8-lg,0);X.stroke();
 blob([[-11,-19,9],[0,-24,10],[11,-19,9],[-5,-13,9],[7,-13,9]],wool,2.5);
 X.beginPath();X.ellipse(18,-21,7,9,0.35,0,Math.PI*2);fillStroke(head,2.5);
 X.beginPath();X.ellipse(13,-28,5,3,-0.6,0,Math.PI*2);fillStroke(head,2);
 X.fillStyle='#fff';circ(20,-23,2.6);X.fill();X.fillStyle=INK;circ(20.7,-23,1.3);X.fill();
 X.restore();
}
function enemyTag(s,x,y,col){X.font='900 9px "Segoe UI",system-ui,sans-serif';const w=X.measureText(s).width+10;rr(x-w/2,y-7,w,14,7);fillStroke(col,2);X.fillStyle='#fff';X.textAlign='center';X.textBaseline='middle';X.fillText(s,x,y+0.5);}
/* Threat: spiky malware blob that walks the ground */
function drawThreat(cx,by,face,t,sc,hurt,boss){

 const lg=Math.sin(t*0.4)*5,body=hurt?'#ffb199':MS.r,spk=hurt?'#ffd0c0':'#b8250f',rot=t*0.03;
 X.strokeStyle=INK;X.lineWidth=6;X.lineCap='round';X.beginPath();X.moveTo(-8,-8);X.lineTo(-8+lg,0);X.moveTo(8,-8);X.lineTo(8-lg,0);X.stroke();
 for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,c=Math.cos(a),s=Math.sin(a);poly([c*15-s*5,-21+s*15+c*5,c*27,-21+s*27,c*15+s*5,-21+s*15-c*5]);fillStroke(spk,2)}
 circ(0,-21,17);fillStroke(body,3);
 X.fillStyle='#ffffff55';circ(-6,-28,5);X.fill();

/* ---------- Level building ---------- */
function addEnemy(lv,t,s,R,spd){
 if(t==='crow'){const y0=s.y-150-R()*40;lv.enemies.push({type:t,x:s.x+s.w/2,y:y0,y0,w:36,h:22,vx:(R()<0.5?-1:1)*(0.9+spd*0.5),minX:s.x-80,maxX:s.x+s.w+80,ph:R()*6});return}
 const gl=t==='glitch',w=gl?28:46,h=gl?28:34;
 if(s.w<160)return;
 const x=s.x+40+R()*(s.w-80-w);
 lv.enemies.push({type:t,x,y:s.y-h,gy:s.y,w,h,vx:(R()<0.5?-1:1)*(gl?1.3:1.05)*spd,minX:s.x+4,maxX:s.x+s.w-4,ph:R()*6});
}
function buildLevel(i){
 const L=LEVELS[i],R=rng(4242+i*977),diff=i/(LEVELS.length-1),spd=1+diff*1.1;
 const len=2600+i*150;
 const lv={i,L,solids:[],plats:[],hazards:[],enemies:[],items:[],sheep:[],flowers:[],segs:[]};
 let x=500,gy=430;
 lv.solids.push({x:-400,y:gy,w:900,h:400});
 while(x<len){
  let ny=clamp(gy+[0,0,-50,50,-40,40][Math.floor(R()*6)],320,450);
  if(R()<L.gaps+diff*0.12){let gap=80+R()*(40+diff*50);if(ny<gy)gap=Math.min(gap,135);x+=Math.round(gap);}
  else if(ny<gy-45)ny=gy-45;
  gy=ny;
  const w=Math.round(240+R()*340),s={x,y:gy,w,h:400};
  lv.solids.push(s);lv.segs.push(s);x+=w;
 }
 const endW=L.boss?1150:700,fin={x,y:gy,w:endW+600,h:400};
 lv.solids.push(fin);
 lv.goal={x:x+endW-190,y:gy};lv.end=x+endW+120;
 lv.start={x:80,y:430};
 lv.segs.forEach(s=>{
  for(let f=s.x+20;f<s.x+s.w-20;f+=40+R()*70)lv.flowers.push({x:f,y:s.y,c:MSC[Math.floor(R()*4)],h:7+R()*9});
  if(s.w>300&&R()<L.hz+diff*0.2){const w=40+Math.round(R()*30);lv.hazards.push({x:s.x+s.w*0.35+R()*s.w*0.3-w/2,y:s.y-18,w,h:18})}
  if(L.en.length&&R()<L.ec+diff*0.3)addEnemy(lv,L.en[Math.floor(R()*L.en.length)],s,R,spd);
  if(R()<L.plats){
   const pw=Math.round(110+R()*70),px=s.x+R()*Math.max(10,s.w-pw),py=s.y-112-R()*35,p={x:px,y:py,w:pw,h:22,x0:px};
   if(L.movers&&R()<0.55){p.move=true;p.range=60+R()*70;p.sp=0.012+R()*0.015;p.ph=R()*6;p.dx=0}
   lv.plats.push(p);

 const cp=G.cp;line(cp.x,cp.y,cp.x,cp.y-90,'#eee',4);X.save();X.translate(cp.x+2,cp.y-88);poly([0,0,cp.on?44:30,cp.on?12+Math.sin(t*0.15)*3:14,0,26]);fillStroke(cp.on?MS.g:'#b0b8c4');X.restore();
 drawGoal(G.goal,L,t);
 for(const it of G.items)if(!it.got&&it.x>cam-30&&it.x<cam+W+30)drawItem(L.item,it.x,it.y,t);
 for(const s of G.sheep)if(s.state==='lost'){drawSheep(s.x,s.y,s.f,0,s.black,1,Math.abs(Math.sin(s.t*0.06))*4);if(Math.floor(s.t/80)%3!==2){rr(s.x-22,s.y-66,44,22,10);fillStroke('#fff',2);text('Baa?',s.x,s.y-55,11,INK,'center',false)}}
 for(const e of G.enemies){if(e.x<cam-120||e.x>cam+W+120)continue;X.save();if(e.dead){X.translate(e.x+e.w/2,e.y+e.h/2);X.scale(1,-1);X.translate(-e.x-e.w/2,-e.y-e.h/2)}
  if(e.type==='crow')drawInjection(e.x+e.w/2,e.y+e.h/2,e.face,t);else if(e.type==='glitch')drawUnmanaged(e.x,e.y,e.w,e.h,t);
  else if(e.type==='big'){if(!(e.hit>0&&Math.floor(e.hit/4)%2))drawThreat(e.x+e.w/2,e.y+e.h,e.face,t,2,e.hit>0,true)}
  else drawThreat(e.x+e.w/2,e.y+e.h,e.face,t,1,e.dead);
  X.restore();}
 const P=G.P;
 for(const s of G.sheep)if(s.state==='follow')drawSheep(s.x,s.y,s.f,P.run*0.15+s.idx*3,s.black,0.9);
 if(!(P.inv>0&&Math.floor(P.inv/4)%2))drawShepherd(P.x+15,P.y+P.h,P.face,P.run*0.12,Math.abs(P.vx)>0.5&&P.on,!P.on);
 for(const p of G.parts){X.globalAlpha=Math.min(1,p.life/20);circ(p.x,p.y,p.r);X.fillStyle=p.c;X.fill()}X.globalAlpha=1;
 for(const p of G.pops){X.globalAlpha=Math.min(1,p.life/20);text(p.s,p.x,p.y,18,p.c);X.globalAlpha=1}
 X.restore();
 if(L.night){const px=P.x+15-cam,py=P.y+20,g=X.createRadialGradient(px,py,80,px,py,520);g.addColorStop(0,'rgba(5,6,15,0)');g.addColorStop(1,L.boss?'rgba(30,0,10,.6)':'rgba(5,6,30,.55)');X.fillStyle=g;X.fillRect(0,0,W,H)}
 if(L.weather!=='stars'&&L.weather!=='none')drawWeather(L.weather,G.weather,t);
 X.restore();
 drawHUD();
}
function panel(x,y,w,h,col){rr(x,y,w,h,16);X.fillStyle=col||'rgba(255,255,255,.94)';X.fill();X.lineWidth=3;X.strokeStyle=INK;X.stroke();}

 const L=G.L;X.fillStyle='rgba(31,24,48,.55)';X.fillRect(0,0,W,H);

/* ---------- Map (level select) ---------- */
function nodePos(i){
 if(i===0)return{x:72,y:118};
 if(i<=7){const j=i-1;return{x:172+j*112,y:118+(j%2?-16:16)}}
 if(i<=14){const j=i-8;return{x:842-j*112,y:250+(j%2?-16:16)}}
 if(i<=18){const j=i-15;return{x:190+j*150,y:385+(j%2?-14:14)}}
 return{x:850,y:385};
}
function drawMap(){
 const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8fd400');g.addColorStop(1,'#4f9a2a');X.fillStyle=g;X.fillRect(0,0,W,H);
 const band=(y,h,c,label,col)=>{rr(20,y,920,h,22);X.fillStyle=c;X.fill();X.lineWidth=3;X.strokeStyle=INK;X.stroke();text(label,40,y+14,12,col,'left',false,900)};
 band(60,112,'#c4ecff',ZN.O.toUpperCase(),MS.blue);band(190,122,'#e2f6c0','GOVERN \u00b7 THE IN-BYE PADDOCKS','#3f7a00');band(325,118,'#ffd9cc','SECURE \u00b7 SHEPHERDS AND SHEEPDOGS',MS.r);
 for(let i=0;i<9;i++)drawSheep(60+i*105+(i%2)*30,i%3===0?300:(i%3===1?178:438),i%2?1:-1,T*0.2+i,i===4,0.55);
 X.lineCap='round';X.lineJoin='round';
 X.beginPath();for(let i=0;i<LEVELS.length;i++){const p=nodePos(i);i?X.lineTo(p.x,p.y):X.moveTo(p.x,p.y)}X.lineWidth=20;X.strokeStyle=INK;X.stroke();X.lineWidth=13;X.strokeStyle='#f3d9a0';X.stroke();
 X.setLineDash([2,14]);X.lineWidth=4;X.strokeStyle='#c99a5c';X.stroke();X.setLineDash([]);
 for(let i=0;i<LEVELS.length;i++){
  const p=nodePos(i),L=LEVELS[i],locked=i>=save.unlocked,r=i===LEVELS.length-1?27:22;
  if(i===sel){circ(p.x,p.y,r+8+Math.sin(T*0.12)*3);X.fillStyle='#ffffff99';X.fill()}
  circ(p.x,p.y,r);fillStroke(locked?'#9a9aa8':ZC[L.zone],3);
  if(locked){rr(p.x-8,p.y-3,16,12,3);fillStroke('#ddd',2);X.beginPath();X.arc(p.x,p.y-4,5,Math.PI,0);X.strokeStyle=INK;X.lineWidth=2.5;X.stroke()}
  else text(L.code==='START'?'GO':L.code,p.x,p.y+1,L.code.length>3?11:13,'#fff');
  const st=save.stars[i]||0;if(!locked)for(let s=0;s<3;s++){starPath(p.x-14+s*14,p.y+r+8,6);fillStroke(s<st?MS.y:'#ffffffaa',1.5)}
 }
 const sp=nodePos(sel);X.save();X.translate(sp.x+26,sp.y-12-Math.abs(Math.sin(T*0.1))*6);drawShepherd(0,0,-1,T*0.1,false,false,0.55);X.restore();
 panel(20,4,920,50,'rgba(31,24,48,.9)');msLogo(36,15,28);text('HILL FARM 365',76,29,24,'#fff','left',false,900);
 const tot=Object.values(save.stars).reduce((a,b)=>a+b,0);text(`\u2605 ${tot} / ${LEVELS.length*3}`,W-40,29,18,MS.y,'right',false,900);
 text('\u2190 \u2192 choose \u00b7 Enter play \u00b7 R reset',W/2+90,29,13,'#cfd4f5','center',false,700);
 const L=LEVELS[sel],locked=sel>=save.unlocked;
 panel(20,450,920,84);rr(34,462,74,60,12);fillStroke(ZC[L.zone]);text(L.code,71,492,L.code.length>3?15:20,'#fff');
 text(L.name,124,474,22,INK,'left',false,900);text(L.meaning,124,498,14,'#666','left',false,700);
 X.font='italic 600 14px "Segoe UI",system-ui,sans-serif';X.textAlign='left';X.fillStyle=MS.blue;X.fillText('\u201c'+L.value+'\u201d',124,518);
 button(790,466,134,50,locked?'LOCKED':'PLAY \u25B6',locked?'#9a9aa8':MS.g);
}
function updateMap(){
 const n=LEVELS.length,max=Math.min(save.unlocked,n)-1;
 if(P_('ArrowRight')||P_('ArrowDown')||P_('KeyD')){sel=Math.min(max,sel+1);SFX.sel()}
 if(P_('ArrowLeft')||P_('ArrowUp')||P_('KeyA')){sel=Math.max(0,sel-1);SFX.sel()}
 if(P_('KeyR')&&confirm('Reset all Hill Farm 365 progress?')){save={unlocked:1,stars:{},best:{}};persist();sel=0}
 if(P_('KeyM'))muted=!muted;
 if(confirmPressed()&&sel<save.unlocked){startLevel(sel);return}
 for(const c of clicks){
  if(inRect(c,790,466,134,50)&&sel<save.unlocked){startLevel(sel);return}
  for(let i=0;i<n;i++){const p=nodePos(i);if(Math.hypot(c.x-p.x,c.y-p.y)<28){if(i<save.unlocked){if(sel===i){startLevel(i);return}sel=i;SFX.sel()}}}
 }
}

/* ---------- Title & win ---------- */
function drawTitle(){
 const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#00A4EF');g.addColorStop(1,'#bff0ff');X.fillStyle=g;X.fillRect(0,0,W,H);
 hills(T*2,0.3,330,30,'#a6dc8c',1,0.005);hills(T*2,0.7,420,22,'#7FBA00',4,0.007);
 for(let k=0;k<4;k++){const cx=((k*280-T*0.5)%1200+1200)%1200-120;blob([[cx,80+k*18,22],[cx+28,70+k*18,28],[cx+58,80+k*18,22]],'#fff',2.5)}
 msLogo(W/2-30,46,60);
 text('HILL FARM 365',W/2,160,72,'#fff');
 text('A SHEEP HERDING ADVENTURE',W/2,222,26,MS.y);
 text('Walk the farm as Agent 365 \u2014 observe, govern and secure the flock',W/2,258,17,INK,'center',false,700);
 for(let k=0;k<5;k++)drawSheep(((T*1.6+k*70)%1200)-120,470-(k%2)*8,1,T+k*5,k===2,1,Math.abs(Math.sin(T*0.15+k))*6);
 drawShepherd(((T*1.6+390)%1200)-120,470,1,T*0.4,true,false,1);
 if(Math.floor(T/30)%2===0)button(W/2-150,300,300,56,isTouch?'TAP TO START':'PRESS ENTER',MS.r);
 text('\u2190 \u2192 move \u00b7 Space / \u2191 jump \u00b7 Esc pause \u00b7 M mute',W/2,390,15,INK,'center',false,700);
}
const confetti=[];
function drawWin(){
 const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0078D4');g.addColorStop(1,'#7FBA00');X.fillStyle=g;X.fillRect(0,0,W,H);
 if(confetti.length<160)confetti.push({x:Math.random()*W,y:-10,vy:1+Math.random()*2,c:MSC[Math.floor(Math.random()*4)],r:Math.random()*6});
 for(const c of confetti){c.y+=c.vy;if(c.y>H)c.y=-10;X.save();X.translate(c.x,c.y);X.rotate(c.y*0.05+c.r);X.fillStyle=c.c;X.fillRect(-4,-6,8,12);X.restore()}
 msLogo(W/2-30,50,60);text('THE WHOLE FARM IS SECURE!',W/2,160,44,MS.y);
 text('Observed, governed and secured \u2014 every sheep is home.',W/2,210,20,'#fff','center',true,800);
 for(let k=0;k<8;k++)drawSheep(220+k*72,400,k%2?1:-1,T+k*7,k===3,1.1,Math.abs(Math.sin(T*0.12+k))*14);
 drawShepherd(W/2,330,1,T,false,false,1.4);
 const tot=Object.values(save.stars).reduce((a,b)=>a+b,0);text(`\u2605 ${tot} / ${LEVELS.length*3} stars`,W/2,450,24,'#fff');
 button(W/2-110,470,220,50,'BACK TO MAP',MS.r);
}

/* ---------- Main loop ---------- */
function update(){
 T++;
 if(state==='title'){if(confirmPressed()||clicks.length){state='map';SFX.sel()}}
 else if(state==='map')updateMap();
 else if(state==='intro'){introT--;G.t++;if(introT<=0||(introT<150&&(confirmPressed()||clicks.length)))state='play'}
 else if(state==='play')updatePlay();
 else if(state==='pause'){if(P_('Escape')||P_('KeyP')||P_('Enter'))state='play';if(P_('KeyM'))muted=!muted;for(const c of clicks){if(inRect(c,W/2-200,290,180,50))state='play';if(inRect(c,W/2+20,290,180,50))state='map'}}
 else if(state==='done'){doneT++;G.t++;for(const p of G.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--}G.parts=G.parts.filter(p=>p.life>0);
  if(doneT>40&&(confirmPressed()||clicks.some(c=>inRect(c,W/2-110,400,220,50)))){if(G.i===LEVELS.length-1){state='win';winT=0}else{sel=Math.min(G.i+1,save.unlocked-1);state='map'}}}
 else if(state==='over'){doneT++;if(doneT>30){if(P_('Enter')||clicks.some(c=>inRect(c,W/2-230,340,220,48)))startLevel(G.i);else if(P_('Escape')||clicks.some(c=>inRect(c,W/2+10,340,220,48)))state='map'}}
 else if(state==='win'){winT++;if(winT>60&&(confirmPressed()||clicks.some(c=>inRect(c,W/2-110,470,220,50))))state='map'}
}
function render(){
 X.setTransform(1,0,0,1,0,0);X.clearRect(0,0,W,H);
 if(state==='title')drawTitle();
 else if(state==='map')drawMap();
 else if(state==='win')drawWin();
 else{drawPlay();if(state==='intro')overlayIntro();else if(state==='done')overlayDone();else if(state==='over')overlayOver();else if(state==='pause')overlayPause();}
 document.getElementById('touch').style.display=(isTouch&&(state==='play'||state==='intro'))?'block':'none';
}
let last=0,acc=0;
function loop(ts){
 const dt=Math.min(100,ts-(last||ts));last=ts;acc+=dt;
 while(acc>=1000/60){update();pressed={};clicks=[];acc-=1000/60}
 render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
